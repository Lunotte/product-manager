services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: product-manager-dev:latest
    container_name: product-manager-dev
    working_dir: /workspace/product-manager
    volumes:
      - .:/workspace/product-manager
      - /workspace/product-manager/node_modules
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
      - "5173:5173"
    command: npm run start
    stdin_open: true
    tty: true
